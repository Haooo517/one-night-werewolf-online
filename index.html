<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一夜終極狼人 Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; overflow-x: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; } 
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #334155; 
            border-radius: 10px; 
            border: 2px solid #1e293b; /* 讓捲軸看起來像懸浮的 */
        }
        
        .role-card { transition: all 0.2s ease; }
        .role-card:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js"
      }
    }
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import ReactDOM from 'react-dom';
        import { initializeApp } from 'firebase/app';
        import { 
          getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, arrayUnion, deleteDoc, arrayRemove
        } from 'firebase/firestore';
        import { 
          getAuth, signInAnonymously, onAuthStateChanged 
        } from 'firebase/auth';
        import { 
          Users, Moon, Sun, RefreshCw, Eye, UserCircle, CheckCircle2, 
          AlertTriangle, ArrowRight, RotateCcw, Info, Link as LinkIcon, 
          Copy, LogIn, Plus, Minus, User, Home, LogOut
        } from 'lucide-react';

        // --- Firebase 配置 (hf4 正確版) ---
        const firebaseConfig = {
          apiKey: "AIzaSyAwTAJvaYw8WrGW-bF4i5r_nfzxsGYGEb4",
          authDomain: "one-night-werewolves.firebaseapp.com",
          projectId: "one-night-werewolves",
          storageBucket: "one-night-werewolves.firebasestorage.app",
          messagingSenderId: "93760667103",
          appId: "1:93760667103:web:c51ccf45717959c610586a",
          measurementId: "G-GW2BBNPF16"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'werewolf-online-default'; // 統一路徑 ID

        // --- 角色定義 ---
        const ALL_ROLES = [
          { id: 'doppelganger', name: '化身幽靈', team: 'villager', description: '查看一名玩家的牌。並化身成為該角色。', priority: 1, multi: false },
          { id: 'werewolf', name: '狼人', team: 'wolf', description: '與其他狼人確認身分。若你是孤狼，可看一張中央牌。', priority: 2, multi: true },
          { id: 'minion', name: '爪牙', team: 'wolf', description: '得知誰是狼人，並且若是你死掉狼人陣營仍能獲勝。', priority: 3, multi: false },
          { id: 'mason', name: '守夜人', team: 'villager', description: '與另一名守夜人確認身分。', priority: 4, multi: false, fixedCount: 2 },
          { id: 'seer', name: '預言家', team: 'villager', description: '查看一名玩家的牌，或查看兩張中央牌。', priority: 5, multi: false },
          { id: 'robber', name: '強盜', team: 'villager', description: '與一名玩家交換牌，並查看自己的新身分（也可以不換）。', priority: 6, multi: false },
          { id: 'troublemaker', name: '搗蛋鬼', team: 'villager', description: '交換另外兩名玩家的牌（也可以不換）。', priority: 7, multi: false },
          { id: 'drunk', name: '酒鬼', team: 'villager', description: '將自己的牌與一張中央牌交換（不可查看）。', priority: 8, multi: false },
          { id: 'insomniac', name: '失眠者', team: 'villager', description: '可在夜晚最後查看自己最終的身分。', priority: 9, multi: false },
          { id: 'hunter', name: '獵人', team: 'villager', description: '如果你死掉，被你投票的玩家會一起被帶走。', priority: 99, multi: false },
          { id: 'villager', name: '村民', team: 'villager', description: '沒有特殊能力。', priority: 99, multi: true },
          { id: 'tanner', name: '皮匠', team: 'tanner', description: '如果你死掉，你就贏了。', priority: 99, multi: false },
        ];

        const App = () => {
          const [user, setUser] = useState(null);
          const [roomId, setRoomId] = useState('');
          const [isHost, setIsHost] = useState(false);
          const [gameState, setGameState] = useState(null);
          const [playerName, setPlayerName] = useState('');
          const [inputRoomId, setInputRoomId] = useState('');
          const [localViewed, setLocalViewed] = useState(null); 
          const [selection, setSelection] = useState([]); 
          const [message, setMessage] = useState('');
          const [timer, setTimer] = useState(20);
          const [hasActed, setHasActed] = useState(false);
          const [activeTab, setActiveTab] = useState('roles');
          const [chatInput, setChatInput] = useState('');
          const [isChatOpen, setIsChatOpen] = useState(false);
          const [lastReadCount, setLastReadCount] = useState(0);
          const chatEndRef = useRef(null);

          // 1. 初始化身份驗證
          useEffect(() => {
            const initAuth = async () => {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, setUser);
            return () => unsubscribe();
          }, []);

          // 2. 監聽房間數據
          useEffect(() => {
            if (!user || !roomId) return;

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            const unsubscribe = onSnapshot(roomRef, (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.status === 'lobby') {
                  setLocalViewed(null);
                  setHasActed(false);
                  setSelection([])
                }
                setGameState(data);
                setIsHost(data.hostId === user.uid);
              } else {
                setGameState(null);
                setRoomId('');
              }
            }, (err) => console.error("Snapshot error:", err));

            return () => unsubscribe();
          }, [user, roomId]);

          const showToast = (msg) => {
            setMessage(msg);
            setTimeout(() => setMessage(''), 3000);
          };

          useEffect(() => {
            const handleUnload = () => {
              if (roomId && user && !isHost) {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                updateDoc(roomRef, {
                  players: arrayRemove(gameState.players.find(p => p.uid === user.uid))
                });
              }
            };
            window.addEventListener('beforeunload', handleUnload);
            return () => window.removeEventListener('beforeunload', handleUnload);
          }, [roomId, user, isHost, gameState?.players]);

          useEffect(() => {
            if (!gameState?.phaseEndTime) return;

            const updateTimer = () => {
              const now = Date.now();
              const diff = gameState.phaseEndTime - now;
              const remaining = Math.max(0, Math.ceil(diff / 1000));
              setTimer(remaining);
              return remaining;
            };

            // 💡 立即執行一次，避免第一秒閃爍
            const initialRemaining = updateTimer();

            const interval = setInterval(async () => {
              const remaining = updateTimer();

              // 僅房主負責執行邏輯切換
              if (isHost && remaining <= 0) {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
                
                if (gameState.status === 'night') {
                  const nextIdx = gameState.activeRolePriority + 1;
                  // 假設 nightOrder 包含了所有需要跑的角色
                  if (nextIdx < gameState.nightOrder.length) {
                    await updateDoc(roomRef, {
                      activeRolePriority: nextIdx,
                      phaseEndTime: Date.now() + (gameState.settings?.nightDuration || 20) * 1000 // 下一個角色再給 20 秒
                    });
                  } else {
                    // 全部角色跑完，進入討論(含投票)
                    await updateDoc(roomRef, { 
                      status: 'discussion', 
                      votes: {},
                      phaseEndTime: null // 討論階段不強制倒數換場
                    });
                  }
                }
              }
            }, 1000);

            return () => clearInterval(interval);
          }, [gameState?.phaseEndTime, gameState?.activeRolePriority, isHost, gameState?.status]);

          useEffect(() => {
            if (isChatOpen && gameState?.messages) {
              setLastReadCount(gameState.messages.length);
              chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }
          }, [gameState?.messages, isChatOpen]);

          const sendMessage = async (e) => {
            e.preventDefault();
            if (!chatInput.trim() || !roomId) return;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            let currentMessages = gameState.messages || [];
            
            // 💡 實作滑動視窗：超過 100 則移除最舊的
            if (currentMessages.length >= 100) {
              currentMessages = currentMessages.slice(1); 
            }

            const newMessage = {
              uid: user.uid,
              name: playerName,
              text: chatInput,
              time: Date.now()
            };

            await updateDoc(roomRef, {
              messages: [...currentMessages, newMessage] // 💡 使用覆蓋方式確保數量控制
            });
            setChatInput('');
          };

          // --- 遊戲動作 ---

          const createRoom = async () => {
            if (!playerName) return showToast("請輸入你的名字");
            const newRoomId = Math.random().toString(36).substring(2, 6).toUpperCase();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', newRoomId);
            
            const initialData = {
              id: newRoomId,
              hostId: user.uid,
              status: 'lobby',
              players: [{ uid: user.uid, name: playerName, isHost: true }],
              selectedRoles: ['werewolf', 'werewolf', 'seer', 'robber', 'troublemaker', 'villager'],
              currentCards: [],
              originalCards: [],
              nightOrder: [],
              votes: {},
              activeRolePriority: 0,
              doppelgangerRole: null,
              settings: { 
                nightDuration: 20,
                tieRule: 'killAll',
                allowSkip: false
              },
              messages: [],
              createdAt: Date.now()
            };

            await setDoc(roomRef, initialData);
            setRoomId(newRoomId);
          };

          const joinRoom = async () => {
            if (!playerName || !inputRoomId) return showToast("請輸入名字與代碼");
            const id = inputRoomId.toUpperCase();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', id);
            const snap = await getDoc(roomRef);
            
            if (!snap.exists()) return showToast("房間不存在");
            const data = snap.data();
            if (data.status !== 'lobby') return showToast("遊戲已在進行中");

            if (!data.players.some(p => p.uid === user.uid)) {
              await updateDoc(roomRef, {
                players: arrayUnion({ uid: user.uid, name: playerName, isHost: false })
              });
            }
            setRoomId(id);
          };

          const leaveRoom = async () => {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            if (isHost) {
              await deleteDoc(roomRef);
            } else {
              if (roomId && user) {
                const playerObj = gameState.players.find(p => p.uid === user.uid);
                if (playerObj) {
                  await updateDoc(roomRef, {
                    players: arrayRemove(playerObj)
                  });
                }
              }
              window.location.reload();
            }
          };

          const startGame = async () => {
            if (!isHost) return;
            const { players, selectedRoles } = gameState;
            if (selectedRoles.length !== players.length + 3) {
              return showToast(`角色數量不正確！需要 ${players.length + 3} 張角色牌。`);
            }

            const shuffled = [...selectedRoles].sort(() => Math.random() - 0.5);
            const cards = shuffled.map((roleId, index) => {
              const role = ALL_ROLES.find(r => r.id === roleId);
              return {
                id: index,
                role: { id: role.id, name: role.name, team: role.team, priority: role.priority },
                ownerUid: index < players.length ? players[index].uid : null,
                ownerName: index < players.length ? players[index].name : `中央 ${index - players.length + 1}`
              };
            });

            const allSelectedRoleIds = [...new Set(selectedRoles)]; // 取得本場所有出現的角色 ID
            const nightOrder = ALL_ROLES
              .filter(r => allSelectedRoleIds.includes(r.id) && r.priority < 90)
              .sort((a, b) => a.priority - b.priority)
              .map(r => r.id);

            const startTime = Date.now();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);

            setHasActed(false);
            setLocalViewed(null);
            setSelection([]);

            await updateDoc(roomRef, {
              status: 'night',
              originalCards: cards,
              currentCards: cards,
              nightOrder: nightOrder,
              activeRolePriority: 0, 
              logs: [],
              doppelgangerRole: null,
              phaseEndTime: startTime + (gameState.settings?.nightDuration || 20) * (nightOrder[0] === 'doppelganger' ? 2000 : 1000),
            });
          };

          const submitNightAction = async () => {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            const newCards = [...gameState.currentCards];
            const myUid = user.uid;
            const myOriginalRole = getMyOriginalRole();
            const currentRoleId = (myOriginalRole.id === 'doppelganger' && gameState.doppelgangerRole) 
              ? gameState.doppelgangerRole 
              : gameState.nightOrder[gameState.activeRolePriority];
            let viewedInfo = "";

            // 行動處理邏輯
            if (currentRoleId === 'seer') {
              if (selection.length > 0) {
                const viewed = selection.map(idx => newCards[idx]);
                viewedInfo = viewed.map(v => `${v.ownerName}: 【${v.role.name}】`).join('、 ');
              } else {
                viewedInfo = "你沒有查看任何牌。";
              }
            } else if (currentRoleId === 'robber') {
              if (selection.length > 0) {
                const targetIdx = selection[0];
                const targetName = newCards[targetIdx].ownerName;
                const targetRoleName = newCards[targetIdx].role.name; // 先抓出目標角色名
                const myIdx = newCards.findIndex(c => c.ownerUid === myUid);
                const tempRole = newCards[myIdx].role;
                newCards[myIdx].role = newCards[targetIdx].role;
                newCards[targetIdx].role = tempRole;
                viewedInfo = `你偷取了 ${targetName} 的身分，你現在是 【${targetRoleName}】。`;
              } else {
                viewedInfo = "你選擇不換牌。";
              }
            } else if (currentRoleId === 'troublemaker') {
              if (selection.length === 2) {
                const [idx1, idx2] = selection;
                const name1 = newCards[idx1].ownerName;
                const name2 = newCards[idx2].ownerName;
                const temp = newCards[idx1].role;
                newCards[idx1].role = newCards[idx2].role;
                newCards[idx2].role = temp;
                viewedInfo = `你交換了 ${name1} 與 ${name2} 的角色。`;
              } else {
                viewedInfo = "你選擇不換牌。";
              }
            } else if (currentRoleId === 'drunk') {
              const targetIdx = selection[0];
              const targetName = newCards[targetIdx].ownerName; // 會顯示 "中央 X"
              const myIdx = newCards.findIndex(c => c.ownerUid === myUid);
              const temp = newCards[myIdx].role;
              newCards[myIdx].role = newCards[targetIdx].role;
              newCards[targetIdx].role = temp;
              viewedInfo = `你已將自己的牌與 【${targetName}】 交換（不可查看）。`;
            } else if (currentRoleId === 'insomniac') {
              const myCard = newCards.find(c => c.ownerUid === myUid);
              viewedInfo = `你查看了自己的牌，你最終的身分是：【${myCard.role.name}】`;
            } else if (currentRoleId === 'werewolf') {
              if (selection.length > 0) {
                const viewed = selection.map(idx => newCards[idx]);
                viewedInfo = viewed.map(v => `${v.ownerName}: 【${v.role.name}】`).join('、 ');
              } else {
                viewedInfo = "已確認身分。";
              }
            } else {
              viewedInfo = "已完成行動。";
            }
            setLocalViewed(viewedInfo);
            
            const myName = gameState.players.find(p => p.uid === user.uid)?.name;
            const displayRoleName = (myRoleObj.id === 'doppelganger' && gameState.doppelgangerRole)
              ? `化身-${ALL_ROLES.find(r => r.id === gameState.doppelgangerRole).name}`
              : myRoleObj.name;
            const logEntry = `${myName} (${displayRoleName}): ${viewedInfo}`;
            await updateDoc(roomRef, { 
              currentCards: newCards,
              logs: arrayUnion(logEntry)
             });
            setHasActed(true);
          };

          const submitDoppelgangerView = async () => {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            const targetIdx = selection[0];
            const targetCard = gameState.currentCards[targetIdx];
            const copiedRoleId = targetCard.role.id;
            
            const myName = gameState.players.find(p => p.uid === user.uid)?.name;
            const viewLog = `${myName} (化身幽靈) 查看了 ${targetCard.ownerName}，化身為：【${targetCard.role.name}】`;

            await updateDoc(roomRef, {
              doppelgangerRole: copiedRoleId,
              logs: arrayUnion(viewLog)
            });
            
            setSelection([]); 
            setLocalViewed(`你現在是：【${targetCard.role.name}】`);
          };

          const isMyTurn = useMemo(() => {
            if (!gameState || gameState.status !== 'night') return false;
            const currentActiveRole = gameState.nightOrder[gameState.activeRolePriority];
            const myOriginalRole = gameState.originalCards.find(c => c.ownerUid === user?.uid)?.role.id;
            if (myOriginalRole === 'doppelganger') {
              if (currentActiveRole === 'doppelganger') return true;
              if (gameState.doppelgangerRole === currentActiveRole) return true;
            }
            return myOriginalRole === currentActiveRole;
          }, [gameState, user]);

          const submitVote = async (targetUid) => {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            const currentVote = gameState.votes?.[user.uid];
            const newVote = currentVote === targetUid ? null : targetUid;
            await updateDoc(roomRef, {
              [`votes.${user.uid}`]: newVote
            });
          };

          const calculateWinner = (gameState) => {
            const { players, currentCards, votes, settings } = gameState;
            const voteCounts = {};
            const numPlayers = players.length;
            const isSkipEnabled = settings?.allowSkip; // 💡 偵測棄票設定是否開啟
            
            // 1. 統計票數
            Object.values(votes || {}).forEach(vuid => {
              voteCounts[vuid] = (voteCounts[vuid] || 0) + 1;
            });

            const playerVoteCounts = { ...voteCounts };
            delete playerVoteCounts['skip'];
            const maxPlayerVotes = Math.max(...Object.values(playerVoteCounts), 0);
            const skipVotes = voteCounts['skip'] || 0;

            // 2. 確定出局者與平票狀態
            let losers = [];
            let isTie = false;
            const candidates = Object.keys(playerVoteCounts).filter(uid => playerVoteCounts[uid] === maxPlayerVotes);

            if (isSkipEnabled) {
              // --- 💡 情況 A：棄票開啟 (您的新規則) ---
              // 規則：只要獲得一票就被處死
              if (maxPlayerVotes > 0) {
                if (candidates.length > 1 && settings?.tieRule === 'pk') {
                  isTie = true;
                  losers = candidates;
                } else {
                  losers = candidates;
                }
              }
            } else {
              // --- 💡 情況 B：棄票關閉 (原始規則) ---
              // 規則：最高票且必須大於 1 票才處死，平票則可能進入 PK
              if (maxPlayerVotes > 1) {
                if (candidates.length > 1 && settings?.tieRule === 'pk') {
                  isTie = true;
                  losers = candidates;
                } else {
                  losers = candidates;
                }
              }
            }

            // 3. 角色與陣營狀態定義
            const playerRoles = currentCards.filter(c => c.ownerUid).map(card => {
              // 💡 如果這張牌原本是化身幽靈，則將其身分「視為」化身後的角色
              if (card.role.id === 'doppelganger' && gameState.doppelgangerRole) {
                const copiedRole = ALL_ROLES.find(r => r.id === gameState.doppelgangerRole);
                return { ...card, role: { ...copiedRole } };
              }
              return card;
            });
            const deadHunters = playerRoles.filter(c => losers.includes(c.ownerUid) && c.role.id === 'hunter');
            deadHunters.forEach(hunter => {
              const targetUid = votes[hunter.ownerUid]; // 取得獵人投票的對象
              // 💡 如果獵人有投票，且目標不是「棄票」，且目標目前還沒在出局名單中
              if (targetUid && targetUid !== 'skip' && !losers.includes(targetUid)) {
                losers.push(targetUid); // 獵人帶走目標
              }
            });
            const realWolfInGame = playerRoles.some(c => c.role.id === 'werewolf');
            const deadRoles = playerRoles.filter(c => losers.includes(c.ownerUid)).map(c => c.role.id);
            const realWolfDied = playerRoles.some(c => losers.includes(c.ownerUid) && c.role.id === 'werewolf');
            const minionInGame = playerRoles.some(c => c.role.id === 'minion');
            const minionDied = playerRoles.some(c => losers.includes(c.ownerUid) && c.role.id === 'minion');

            // --- 4. 勝負邏輯判定 ---

            // A. 皮匠優先
            if (deadRoles.includes('tanner')) {
              return { winner: 'tanner', message: '皮匠被放逐了！皮匠單獨獲勝！', dead: losers, isTie };
            }

            // B. 無狼人（True Wolf）局
            if (!realWolfInGame) {
              if (isSkipEnabled) {
                // 💡 棄票開啟：必須全員棄票獲勝，或者是抓到爪牙獲勝
                if (skipVotes === numPlayers) {
                  return { winner: 'villager', message: '場上沒有狼人，大家平安無事！村民獲勝！', dead: [], isTie };
                } else if (minionDied) {
                  // 如果沒狼人但有爪牙，且爪牙被投死了，村民依然贏
                  return { winner: 'villager', message: '成功抓到了爪牙！村民獲勝！', dead: losers, isTie };
                } else {
                  const msg = minionInGame ? '冤枉啊！雖然沒狼人但處死了村民！狼人獲勝！' : '冤枉啊！場上沒狼人卻處死了村民！無人獲勝！';
                  return { winner: 'wolf', message: msg, dead: losers, isTie };
                }
              } else {
                // 💡 棄票關閉：沒人死則村民贏，或是死的是爪牙則村民贏
                if (losers.length === 0) {
                  return { winner: 'villager', message: '場上沒有狼人，大家平安無事！村民獲勝！', dead: [], isTie };
                } else if (minionDied) {
                  return { winner: 'villager', message: '成功抓到了爪牙！村民獲勝！', dead: losers, isTie };
                } else {
                  const msg = minionInGame ? '冤枉啊！雖然沒狼人但處死了村民！狼人獲勝！' : '冤枉啊！場上沒狼人卻處死了村民！無人獲勝！';
                  return { winner: 'wolf', message: msg, dead: losers, isTie };
                }
              }
            }

            // C. 有狼人（True Wolf）局
            if (realWolfDied) {
              return { winner: 'villager', message: '成功抓到狼人了！村民獲勝！', dead: losers, isTie };
            } else {
              const msg = minionDied ? '爪牙替狼人頂罪了！狼人獲勝！' : '狼人成功逃脫！狼人獲勝！';
              return { winner: 'wolf', message: msg, dead: losers, isTie };
            }
          };

          const handlePhaseTimeout = async () => {
            if (!isHost) return;
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            
            if (gameState.status === 'night') {
              // 夜晚強制定向到討論 (通常夜晚會由最後一個行動者觸發，這當作保險)
              await updateDoc(roomRef, { status: 'discussion' });
            } else if (gameState.status === 'discussion') {
              // 討論結束，進入投票
              await updateDoc(roomRef, { status: 'voting', votes: {} });
            }
          };

          const getMyOriginalRole = () => gameState?.originalCards.find(c => c.ownerUid === user?.uid)?.role;

          // --- UI 組件 ---

          const RoleCounter = ({ role }) => {
            const count = gameState.selectedRoles.filter(r => r === role.id).length;
            const isHost = gameState.hostId === user?.uid;
            
            const updateRoles = async (delta) => {
              if (!isHost) return;
              let newRoles = [...gameState.selectedRoles];
              if (delta > 0) {
                if (role.fixedCount) for(let i=0; i<role.fixedCount; i++) newRoles.push(role.id);
                else newRoles.push(role.id);
              } else {
                if (role.fixedCount) newRoles = newRoles.filter(r => r !== role.id);
                else { const idx = newRoles.indexOf(role.id); if (idx > -1) newRoles.splice(idx, 1); }
              }
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { selectedRoles: newRoles });
            };

            return (
              <div className={`p-3 rounded-2xl border flex justify-between items-center transition-all 
                ${count > 0 ? 'border-blue-500 bg-blue-600/10' : 'border-slate-800 brightness-50 grayscale-[0.5]'} 
                relative hover:z-[150] hover:brightness-100 hover:grayscale-0 group/card`}>
                
                <div className="flex flex-col group relative">
                  <div className="flex items-center gap-1.5 cursor-help">
                    <span className="font-bold text-base">{role.name}</span>
                    {count > 0 && (
                      <span className="text-sm text-blue-400 font-black">
                        x{count}
                      </span>
                    )}
                    <Info size={14} className="text-slate-600 group-hover:text-blue-400 transition-colors" />
                  </div>

                  {/* 💡 縮小版 Tooltip：調整寬度與字體 */}
                  <div className="absolute left-0 top-full mt-1 w-56 p-3 bg-slate-900 border border-blue-500/50 rounded-2xl text-[14px] text-slate-300 leading-snug shadow-2xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all z-[200] backdrop-blur-xl">
                    <p className="font-black text-blue-400 mb-0.5 flex items-center gap-1">
                      <Info size={14}/> 角色能力
                    </p>
                    {role.description}
                    <div className="absolute left-6 bottom-full w-2 h-2 bg-slate-900 border-l border-t border-blue-500/50 rotate-45 translate-y-1"></div>
                  </div>
                </div>

                {isHost && (
                  <div className="flex gap-2 items-center">
                    {count > 0 && (
                      <button onClick={() => updateRoles(-1)} className="p-1.5 bg-slate-800 rounded-lg hover:text-red-400 transition-colors shadow-md">
                        <Minus size={12}/>
                      </button>
                    )}
                    {(role.multi || count === 0) && (
                      <button onClick={() => updateRoles(1)} className="p-1.5 bg-slate-800 rounded-lg hover:text-green-400 transition-colors shadow-md">
                        <Plus size={12}/>
                      </button>
                    )}
                  </div>
                )}
            </div>
            );
          };

          const ResultCard = ({ card, originalCards, doppelgangerRole }) => {
            const original = originalCards.find(oc => oc.id === card.id);
            let displayRoleName = card.role.name;
            if (original.role.id === 'doppelganger' && doppelgangerRole) {
              const copied = ALL_ROLES.find(r => r.id === doppelgangerRole);
              displayRoleName = `${copied.name}`;
            }
            return (
              <div className="flex flex-col items-center gap-2">
                <div className="p-4 bg-white text-slate-900 rounded-2xl font-black w-full text-center shadow-lg text-lg">
                  {card.role.name}
                </div>
                <div className="text-[16px] text-slate-500 font-bold uppercase tracking-widest">
                  {card.ownerName}
                </div>
                {/* 顯示原始身分 */}
                <div className="text-[14px] text-slate-500">原: {original.role.name}</div>
              </div>
            );
          };

          const NightActionScreen = () => {
            const originalRole = getMyOriginalRole();
            const role = (originalRole.id === 'doppelganger' && gameState.doppelgangerRole)
              ? ALL_ROLES.find(r => r.id === gameState.doppelgangerRole)
              : originalRole;
            const werewolves = gameState.currentCards.filter(c => {
              const isOriginalWolf = gameState.originalCards.find(oc => oc.id === c.id)?.role.id === 'werewolf';
              const isDoppelWolf = gameState.originalCards.find(oc => oc.id === c.id)?.role.id === 'doppelganger' && gameState.doppelgangerRole === 'werewolf';
              return (isOriginalWolf || isDoppelWolf) && c.ownerUid;
            });
            const wolfNames = werewolves.map(w => w.ownerName);
            const isLoneWolf = role.id === 'werewolf' && werewolves.length === 1;
            const teammates = werewolves.filter(w => w.ownerUid !== user.uid).map(w => w.ownerName);
            const masons = gameState.originalCards.filter(c => c.role.id === 'mason' && c.ownerUid);
            const otherMason = masons.filter(m => m.ownerUid !== user.uid).map(m => m.ownerName);

            if (originalRole.id === 'doppelganger' && !gameState.doppelgangerRole) {
              return (
                <div className="w-full bg-indigo-900/20 border border-indigo-500/50 p-8 rounded-[3rem] animate-in zoom-in-95">
                  <h3 className="text-2xl font-black text-indigo-400 mb-6 text-center">化身幽靈：請選擇一名玩家</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                    {gameState.currentCards.map((c, idx) => {
                      const isMe = c.ownerUid === user.uid;
                      const isPlayer = !!c.ownerUid;
                      if (!isPlayer || isMe) return null; // 只能看別人的牌

                      return (
                        <button 
                          key={idx}
                          onClick={() => setSelection([idx])}
                          className={`p-4 rounded-2xl border-2 transition-all ${selection.includes(idx) ? 'border-indigo-400 bg-indigo-400/20 scale-105' : 'border-slate-700 bg-slate-800'}`}
                        >
                          <div className="font-bold text-sm">{c.ownerName}</div>
                        </button>
                      );
                    })}
                  </div>
                  <button 
                    disabled={selection.length !== 1}
                    onClick={submitDoppelgangerView}
                    className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-black"
                  >
                    查看並化身
                  </button>
                </div>
              );
            }

            // --- A. 不需要手動操作的角色 (直接返回專屬畫面) ---
            // 1. 多狼人：直接看同伴
            if (role.id === 'werewolf' && !isLoneWolf) {
              useEffect(() => {
                if (teammates.length > 0) setLocalViewed(`狼人同伴：${teammates.join('、 ')}`);
              }, []);

              return (
                <div className="w-full bg-red-900/20 border border-red-500/50 p-10 rounded-[3rem] text-center animate-in zoom-in-95">
                  <Users size={56} className="text-red-500 mx-auto mb-4" />
                  <h3 className="text-3xl font-black text-red-400 mb-6 tracking-tighter">狼人同伴</h3>
                  <div className="bg-slate-900/50 p-6 rounded-3xl border border-red-500/20 mb-6">
                    <div className="text-white text-2xl font-black">{teammates.length > 0 ? teammates.join(' 、 ') : "沒有其他狼人"}</div>
                  </div>
                  <p className="text-slate-500 text-sm">無需行動，請等待夜晚結束...</p>
                </div>
              );
            }

            // 2. 爪牙：直接看狼人
            if (role.id === 'minion') {
              useEffect(() => {
                setLocalViewed(wolfNames.length > 0 ? `狼人成員：${wolfNames.join('、 ')}` : "場上沒有狼人");
              }, []);

              return (
                <div className="w-full bg-orange-900/20 border border-orange-500/50 p-10 rounded-[3rem] text-center animate-in zoom-in-95">
                  <User size={56} className="text-orange-400 mx-auto mb-4" />
                  <h3 className="text-3xl font-black text-orange-400 mb-6 tracking-tighter">爪牙確認</h3>
                  <div className="bg-slate-900/50 p-6 rounded-3xl border border-orange-500/20 mb-6">
                    <p className="text-slate-500 text-sm mb-2">你得知了狼人的身分...</p>
                    <div className="text-white text-2xl font-black">{wolfNames.length > 0 ? wolfNames.join(' 、 ') : "場上沒有狼人，你是唯一的大哥！"}</div>
                  </div>
                  <p className="text-slate-500 text-xs mt-2">無需行動，請等待夜晚結束...</p>
                </div>
              );
            }

            // 3. 守夜人：直接看同伴
            if (role.id === 'mason') {
              useEffect(() => {
                setLocalViewed(otherMason.length > 0 ? `守夜人同伴：${otherMason.join('、 ')}` : "場上沒有守夜人同伴");
              }, []);

              return (
                <div className="w-full bg-blue-900/20 border border-blue-500/50 p-10 rounded-[3rem] text-center animate-in zoom-in-95">
                  <Users size={56} className="text-blue-400 mx-auto mb-4" />
                  <h3 className="text-3xl font-black text-blue-400 mb-6 tracking-tighter">守夜人同伴</h3>
                  <div className="bg-slate-900/50 p-6 rounded-3xl border border-blue-500/20 mb-6">
                    <div className="text-white text-2xl font-black">{otherMason.length > 0 ? otherMason.join(' 、 ') : "場上沒有守夜人同伴，你要自己加油啊！"}</div>
                  </div>
                  <p className="text-slate-500 text-xs">無需行動，請等待夜晚結束...</p>
                </div>
              );
            }

            // 4. 失眠者：直接看最終身分 (自動化)
            if (role.id === 'insomniac') {
              const myFinalCard = gameState.currentCards.find(c => c.ownerUid === user.uid);
              useEffect(() => {
                setLocalViewed(`你最終的身分是：【${myFinalCard.role.name}】`);
                setHasActed(true);
              }, []);

              return (
                <div className="w-full bg-purple-900/20 border border-purple-500/50 p-10 rounded-[3rem] text-center animate-in zoom-in-95">
                  <Eye size={56} className="text-purple-400 mx-auto mb-4" />
                  <h3 className="text-3xl font-black text-purple-400 mb-6 tracking-tighter">身分確認</h3>
                  <div className="bg-slate-900/50 p-6 rounded-3xl border border-purple-500/20 mb-6">
                    <p className="text-slate-500 text-sm mb-2">天亮前你偷偷看了一眼...</p>
                    <div className="text-white text-3xl font-black">【{myFinalCard.role.name}】</div>
                  </div>
                  <p className="text-slate-500 text-sm">無需操作，請等待夜晚結束...</p>
                </div>
              );
            }

            // 防呆驗證：判斷「確認行動」按鈕是否可點擊
            const canSubmit = useMemo(() => {
              if (hasActed) return false;
              const numPlayers = gameState.players.length;
              const selectedIsCenter = selection.every(idx => idx >= numPlayers);
              const selectedIsPlayer = selection.every(idx => idx < numPlayers);

              if (role.id === 'seer') {
                // 預言家：選 1 個玩家 或 選 2 個中央
                if (selection.length === 1 && selectedIsPlayer) return true;
                if (selection.length === 2 && selectedIsCenter) return true;
                return false;
              }
              if (role.id === 'robber') {
                // 強盜：選 0 個 (不換) 或 1 個玩家
                return selection.length === 0 || (selection.length === 1 && selectedIsPlayer);
              }
              if (role.id === 'troublemaker') {
                // 搗蛋鬼：選 0 個 (不換) 或選 2 個玩家
                return selection.length === 0 || (selection.length === 2 && selectedIsPlayer);
              }
              if (role.id === 'werewolf' && isLoneWolf) {
                // 孤狼：選 1 個中央
                if (selection.length === 1 && selectedIsCenter) return true;
                return false;
              }
              if (role.id === 'drunk') {
                // 酒鬼：選 1 個中央
                return selection.length === 1 && selectedIsCenter;
              }
              // 其他角色 (如失眠者、多狼、守夜人) 通常不需手動選取，直接點確認
              return selection.length === 0;
            }, [role, selection, localViewed, gameState]);

            return (
              <div className="w-full bg-blue-900/20 border border-blue-500/50 p-8 rounded-[3rem] shadow-2xl animate-in zoom-in-95 duration-500">
                <h3 className="text-2xl font-black text-blue-400 mb-6 text-center underline underline-offset-8 decoration-4">輪到你了：{role.name}</h3>
                {originalRole.id === 'doppelganger' && gameState.doppelgangerRole && !hasActed && (
                  <div className="bg-indigo-600/20 p-4 rounded-2xl border border-indigo-500/50 text-center animate-in slide-in-from-top-2 mb-4">
                    <p className="text-[14px] font-black text-indigo-400 uppercase tracking-[0.2em] mb-1">化身能力觸發</p>
                    <p className="text-lg font-black text-white">你現在是【{role.name}】，請立刻執行能力</p>
                  </div>
                )}

                {hasActed ? (
                  <div className="flex flex-col items-center py-10">
                    <CheckCircle2 size={48} className="text-green-500 mb-4 animate-bounce" />
                    <h3 className="text-2xl font-black text-green-400 mb-4">行動已完成</h3>
                    
                    {localViewed && (
                      <div className="mt-4 p-6 bg-slate-800 rounded-3xl border-2 border-yellow-500/50 shadow-[0_0_20px_rgba(234,179,8,0.2)]">
                        <p className="text-yellow-500 font-black mb-2 text-sm uppercase tracking-widest">昨晚看到的資訊：</p>
                        <div className="text-white text-xl font-black">{localViewed}</div>
                      </div>
                    )}
                    
                    <p className="text-slate-500 text-sm mt-8">請閉上眼靜待倒數結束，不要讓別人看到你的螢幕...</p>
                  </div>
                ) : (
                  <>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                      {gameState.currentCards.map((c, idx) => {
                        const isMe = c.ownerUid === user.uid;
                        const isSelected = selection.includes(idx);
                        const isCenter = !c.ownerUid;
                        
                        // 決定哪些牌可以點擊
                        let canClick = true;
                        if (isMe) canClick = false;
                        if (role.id === 'robber' && isCenter) canClick = false;
                        if (role.id === 'troublemaker' && isCenter) canClick = false;
                        if (role.id === 'drunk' && !isCenter) canClick = false;
                        if (role.id === 'werewolf' && isLoneWolf && !isCenter) canClick = false;

                        return (
                          <button 
                            key={idx} 
                            disabled={!canClick}
                            onClick={() => {
                              if (selection.includes(idx)) {
                                // 已選取的再次點擊則取消
                                setSelection(selection.filter(i => i !== idx));
                              } else {
                                // 選取上限邏輯
                                if (role.id === 'troublemaker') {
                                    if (selection.length < 2) setSelection([...selection, idx]);
                                } else if (role.id === 'seer') {
                                  if (isCenter) {
                                    if (selection.some(i => i < gameState.players.length)) setSelection([idx]);
                                    else if (selection.length < 2) setSelection([...selection, idx]);
                                  } else {
                                    setSelection([idx]);
                                  }
                                } 
                                else if (role.id === 'werewolf' && isLoneWolf) {
                                  if (isCenter) {
                                    setSelection([idx]); 
                                  } else {
                                    showToast("孤狼只能查看中央牌");
                                  }
                                } else {
                                    // 強盜、酒鬼等單選
                                    setSelection([idx]);
                                }
                              }
                            }}
                            className={`p-4 rounded-2xl border-2 text-center transition-all ${isSelected ? 'border-yellow-400 bg-yellow-400/20 scale-105 shadow-[0_0_15px_rgba(250,204,21,0.3)]' : 'border-slate-700 bg-slate-800'} ${!canClick ? 'opacity-30 grayscale cursor-not-allowed' : 'hover:border-blue-400 active:scale-95'}`}
                          >
                            <div className="text-[14px] text-slate-500 mb-1">{!isCenter ? '玩家' : '桌面'}</div>
                            <div className="font-bold text-sm truncate">{c.ownerName}</div>
                          </button>
                        );
                      })}
                    </div>

                    <div className="flex flex-col items-center gap-6">
                      {localViewed && (
                        <div className="p-6 bg-slate-900 rounded-3xl border border-yellow-500/30 text-yellow-400 font-black text-xl animate-bounce text-center">
                            {localViewed}
                        </div>
                      )}
                      <button 
                        disabled={!canSubmit}
                        onClick={submitNightAction}
                        className="w-full sm:w-auto px-16 py-5 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:opacity-50 text-white font-black text-xl rounded-3xl shadow-xl transition-all"
                      >
                        確認行動
                      </button>
                      {(role.id === 'robber' || role.id === 'troublemaker') && selection.length === 0 && (
                        <p className="text-sm text-slate-500">（可選擇不換牌直接點確認）</p>
                      )}
                    </div>
                  </>
                )}
              </div>
            );
          };

          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 p-4 font-sans selection:bg-blue-500/30 overflow-x-hidden">
              {message && (
                <div className="fixed top-10 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white px-8 py-4 rounded-full font-black shadow-2xl animate-in slide-in-from-top-10">
                  {message}
                </div>
              )}

              <header className="max-w-4xl mx-auto flex justify-between items-center mb-10 border-b border-slate-800 pb-4">
                <div className="flex items-center gap-2">
                  <div className="p-2 bg-blue-600 rounded-lg"><Moon size={20} className="text-white" /></div>
                  <h1 className="text-xl font-black tracking-tight uppercase">ONE NIGHT <span className="text-blue-500">WEREWOLF</span></h1>
                </div>
                {gameState?.status === 'lobby' && (
                  <button 
                    onClick={leaveRoom} 
                    className="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-red-900/40 text-slate-400 hover:text-red-400 rounded-full text-xs font-bold transition-all border border-slate-700"
                  >
                    <LogOut size={14}/> 退出遊戲
                  </button>
                )}
              </header>

              <main className="max-w-4xl mx-auto">
                {localViewed && gameState?.status !== 'lobby' && (
                  <div className="fixed bottom-10 right-10 z-40 animate-in slide-in-from-right-10">
                    <div className="bg-slate-800 border-2 border-yellow-500 rounded-3xl p-5 shadow-[0_0_30px_rgba(234,179,8,0.2)]">
                      <div className="flex items-center gap-2 mb-2">
                        <Eye size={16} className="text-yellow-500" />
                        <span className="text-[12px] font-black uppercase text-slate-500 tracking-widest">昨晚行動結果</span>
                      </div>
                      <div className="text-white font-black text-lg">{localViewed}</div>
                    </div>
                  </div>
                )}

                {gameState && (gameState.status === 'night' || gameState.status === 'discussion' || gameState.status === 'voting' || gameState.status === 'pk_voting') && (
                  <div className="hidden lg:block fixed left-10 top-1/2 -translate-y-1/2 w-48 space-y-4 animate-in fade-in slide-in-from-left-10 duration-700">
                    <div className="bg-slate-900/80 backdrop-blur-md border border-slate-800 p-6 rounded-[2.5rem] shadow-2xl">
                      <h4 className="text-sm font-black text-slate-500 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                        <Info size={14} className="text-blue-500" /> 本局角色名單
                      </h4>
                      <div className="space-y-3">
                        {/* 統計每種角色的數量並顯示 */}
                        {[...new Set(gameState.selectedRoles)].map(roleId => {
                          const role = ALL_ROLES.find(r => r.id === roleId);
                          const count = gameState.selectedRoles.filter(id => id === roleId).length;
                          return (
                            <div key={roleId} className="flex justify-between items-center group">
                              <span className="text-sm font-bold text-slate-300 group-hover:text-white transition-colors">
                                {role?.name}
                              </span>
                              <span className="text-xs font-black text-blue-500 bg-blue-500/10 px-2 py-0.5 rounded-full">
                                x{count}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                      <div className="mt-6 pt-4 border-t border-slate-800 text-sm text-slate-600 font-bold">
                        共 {gameState.selectedRoles.length} 張牌
                      </div>
                    </div>
                  </div>

                              ))}
                            </div>
                          </div>
                        </div>

                        {/* 3. 按鈕區 (維持原樣) */}
                        <div className="mt-20 flex flex-col sm:flex-row gap-6 justify-center">
                          {isHost && (
                            <button 
                              onClick={() => updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId), { status: 'lobby' })} 
                              className="px-16 py-6 bg-slate-800 hover:bg-slate-700 text-white font-black text-2xl rounded-[2.5rem] shadow-xl transition-all"
                            >
                              再來一局
                            </button>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </main>

              {gameState && (
                <div className={`fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-2xl z-[100] transition-all duration-500 ease-in-out ${isChatOpen ? 'translate-y-0' : 'translate-y-[calc(100%-48px)]'}`}>
                  <div className="bg-slate-900 border-x border-t border-slate-700 rounded-t-[2rem] shadow-[0_-20px_50px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col h-[400px]">
                    
                    {/* 頂部標題與收納按鈕 */}
                    <div 
                      onClick={() => setIsChatOpen(!isChatOpen)}
                      className="p-3 border-b border-slate-800 flex items-center justify-between cursor-pointer bg-slate-900 hover:bg-slate-800 transition-colors"
                    >
                      <div className="flex items-center gap-2 ml-4">
                        <div className={`w-2 h-2 rounded-full ${gameState.status === 'night' ? 'bg-red-500' : 'bg-green-500 animate-pulse'}`}></div>
                        <span className="font-black text-sm text-slate-400 uppercase tracking-widest">
                          {gameState.status === 'night' ? '夜晚禁言中' : '即時討論區'}
                        </span>
                        {gameState.messages?.length > lastReadCount && !isChatOpen && (
                          <span className="bg-blue-600 text-white text-[12px] px-2 py-0.5 rounded-full font-black animate-bounce shadow-[0_0_10px_rgba(37,99,235,0.5)]">
                            New
                          </span>
                        )}
                      </div>
                      <button className="p-1 mr-2 text-slate-500 hover:text-white">
                        {isChatOpen ? <Minus size={20} /> : <Plus size={20} />}
                      </button>
                    </div>

                    {/* 訊息顯示區 */}
                    <div className="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar bg-slate-900/50">
                      {gameState.messages?.length === 0 ? (
                        <div className="h-full flex items-center justify-center text-slate-700 font-bold text-sm">尚無訊息</div>
                      ) : (
                        gameState.messages?.map((msg, i) => (
                          <div key={i} className={`flex flex-col ${msg.uid === user.uid ? 'items-end' : 'items-start'}`}>
                            <span className="text-[10px] font-black text-slate-500 mb-1 px-2">{msg.name}</span>
                            <div className={`px-4 py-2 rounded-2xl max-w-[85%] text-sm font-medium shadow-sm ${
                              msg.uid === user.uid 
                              ? 'bg-blue-600 text-white rounded-tr-none' 
                              : 'bg-slate-800 text-slate-200 rounded-tl-none border border-slate-700'
                            }`}>
                              {msg.text}
                            </div>
                          </div>
                        ))
                      )}
                      <div ref={chatEndRef} />
                    </div>

                    {/* 下方輸入區 */}
                    <div className="p-4 bg-slate-900 border-t border-slate-800">
                      {gameState.status !== 'night' ? (
                        <form onSubmit={sendMessage} className="flex gap-2">
                          <input 
                            value={chatInput}
                            onChange={(e) => setChatInput(e.target.value)}
                            placeholder="輸入訊息參與討論..."
                            className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-sm outline-none focus:border-blue-500/50 transition-all text-white"
                          />
                          <button type="submit" className="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl font-black text-sm transition-all shadow-lg shadow-blue-600/20">
                            傳送
                          </button>
                        </form>
                      ) : (
                        <div className="py-2 text-center text-red-500/70 text-sm font-black uppercase tracking-widest flex items-center justify-center gap-2">
                          <Moon size={14} /> 夜晚請保持安靜，嚴禁交流
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              <footer className="max-w-4xl mx-auto mt-20 pt-8 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4 text-slate-600 text-[10px] uppercase font-black tracking-[0.2em]">
                <div className="flex items-center gap-2">
                  <Moon size={14} className="text-blue-500" />
                  <span>One Night Werewolf Online</span>
                </div>
                <div className="opacity-50">v1.0 Offical version</div>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
